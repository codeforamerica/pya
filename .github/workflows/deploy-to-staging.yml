name: Deploy to AWS Staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # TEMPORARY: for testing the shared build workflow. See the deploy job.
      stop_after_push:
        description: "Stop after pushing the image to ECR (skip the staging deploy)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/ci.yml
  build:
    needs: ["tests"]
    # TODO: Pin to main once codeforamerica/github-actions#14 is merged.
    uses: codeforamerica/github-actions/.github/workflows/ecr-build-push.yaml@22cba9c7d216ab83d63684e5835d7337718a9175
    permissions:
      contents: read
      id-token: write
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
      REGISTRY_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.DOCKER_HUB_READONLY_TOKEN }}
    with:
      ecr-repository: pya-staging-web
      environment: staging
  deploy:
    name: deploy
    needs: ["build"]
    # TEMPORARY: lets us test the image build without deploying. Remove with
    # the stop_after_push input once the shared build workflow is verified.
    if: ${{ !inputs.stop_after_push }}
    environment: staging
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.sha }}
      INFRA_REPO: tax-benefits-backend
    steps:
      - run: echo 'Starting the staging deploy'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: us-east-1

      - name: Update SSM Version Parameter
        run: |
          echo "tag:$IMAGE_TAG"
          aws ssm put-parameter \
            --name  /pya/staging/web/version \
            --value "$IMAGE_TAG" \
            --overwrite

      - name: Get a deployment token
        uses: actions/create-github-app-token@v3.2.0
        id: token
        with:
          app-id: ${{ secrets.DEPLOYMENT_APP_ID }}
          private-key: ${{ secrets.DEPLOYMENT_APP_KEY }}
          owner: codeforamerica
          repositories: tax-benefits-backend

      - name: Trigger infrastructure deployment
        uses: codex-/return-dispatch@v4
        id: dispatch
        with:
          token: ${{ steps.token.outputs.token }}
          # Update this to match the reference (branch, tag, or
          # commit SHA) you want to deploy.
          ref: main
          # Replace this with the name of the target repository.
          repo: tax-benefits-backend
          owner: codeforamerica
          # Replace this with the name of the workflow to call.
          workflow: deploy.yaml
          # Workflow inputs should be formatted as JSON. You can
          # pass additional inputs as needed.
          workflow_inputs: |
            {
              "environment": "pya-nonprod",
              "config": "staging.pya.fileyourstatetaxes.org"
            }

      - name: Wait on Workflow
        uses: lucasssvaz/wait-on-workflow@v1
        id: waiter
        with:
          github-token: ${{ steps.token.outputs.token }}
          repository: codeforamerica/${{ env.INFRA_REPO }}
          workflow: ${{ steps.dispatch.outputs.run_id }}

      - name: Fail unless the workflow succeeded
        if: ${{ steps.waiter.outputs.conclusion != 'success' }}
        uses: actions/github-script@v9
        with:
          script: |
            core.setFailed('Deployment workflow completed with status: ${{ steps.waiter.outputs.conclusion }}')

  # Runs as its own job so build failures are reported too.
  notify_failure:
    name: notify failure
    needs: ["build", "deploy"]
    if: ${{ failure() && (needs.build.result == 'failure' || needs.deploy.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify deploy failure on Slack
        uses: 8398a7/action-slack@v3
        with:
          text: "<!subteam^S06P99RGJDS> PYA staging deploy failure :sob:"
          status: failure
          fields: message,commit,author,workflow,took
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
