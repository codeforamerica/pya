name: Deploy to AWS Staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stop_after_push:
        description: "Stop after pushing the image to ECR (skip the staging deploy)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/ci.yml
  deploy:
    name: deploy
    needs: ["tests"]
    environment: staging
    runs-on: ubuntu-latest
    env:
      ECR_REPOSITORY: pya-staging-web
      IMAGE_TAG: ${{ github.sha }}
      INFRA_REPO: tax-benefits-backend
    steps:
      - run: echo 'Linter and tests passed.'

      - run: echo 'Starting the staging deploy'

      - name: Check out code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Log in to Docker Hardened Images registry
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_READONLY_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Attestations are disabled on purpose: they make buildx push an image
      # index, and ECR/Inspector reports an index as UnsupportedImageError,
      # leaving the findings on an untagged child manifest. A single-platform
      # manifest is what Inspector can scan by tag.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: 300423309117.dkr.ecr.us-east-1.amazonaws.com/pya-staging-web:${{ env.IMAGE_TAG }}
          provenance: false
          sbom: false
          secrets: |
            github_pat=${{ secrets.DEPLOY_PAT }}

      - name: Stop after image push
        if: ${{ inputs.stop_after_push }}
        run: echo "Image pushed to ECR. Skipping SSM update and infrastructure deploy."

      - name: Update SSM Version Parameter
        if: ${{ !inputs.stop_after_push }}
        run: |
          echo "tag:$IMAGE_TAG"
          aws ssm put-parameter \
            --name  /pya/staging/web/version \
            --value "$IMAGE_TAG" \
            --overwrite

      - name: Get a deployment token
        if: ${{ !inputs.stop_after_push }}
        uses: actions/create-github-app-token@v3.2.0
        id: token
        with:
          app-id: ${{ secrets.DEPLOYMENT_APP_ID }}
          private-key: ${{ secrets.DEPLOYMENT_APP_KEY }}
          owner: codeforamerica
          repositories: tax-benefits-backend

      - name: Trigger infrastructure deployment
        if: ${{ !inputs.stop_after_push }}
        uses: codex-/return-dispatch@v4
        id: dispatch
        with:
          token: ${{ steps.token.outputs.token }}
          # Update this to match the reference (branch, tag, or
          # commit SHA) you want to deploy.
          ref: main
          # Replace this with the name of the target repository.
          repo: tax-benefits-backend
          owner: codeforamerica
          # Replace this with the name of the workflow to call.
          workflow: deploy.yaml
          # Workflow inputs should be formatted as JSON. You can
          # pass additional inputs as needed.
          workflow_inputs: |
            {
              "environment": "pya-nonprod",
              "config": "staging.pya.fileyourstatetaxes.org"
            }

      - name: Wait on Workflow
        if: ${{ !inputs.stop_after_push }}
        uses: lucasssvaz/wait-on-workflow@v1
        id: waiter
        with:
          github-token: ${{ steps.token.outputs.token }}
          repository: codeforamerica/${{ env.INFRA_REPO }}
          workflow: ${{ steps.dispatch.outputs.run_id }}

      - name: Fail unless the workflow succeeded
        if: ${{ !inputs.stop_after_push && steps.waiter.outputs.conclusion != 'success' }}
        uses: actions/github-script@v9
        with:
          script: |
            core.setFailed('Deployment workflow completed with status: ${{ steps.waiter.outputs.conclusion }}')

      - name: Notify deploy failure on Slack
        uses: 8398a7/action-slack@v3
        if: failure()
        with:
          text: "<!subteam^S06P99RGJDS> PYA staging deploy ${{ job.status }} :sob:"
          status: ${{ job.status }}
          fields: message,commit,author,workflow,took
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
